name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Bundle Android
        run: npx expo export --platform android
        env:
          CI: '1'
      - name: Bundle iOS
        run: npx expo export --platform ios
        env:
          CI: '1'
